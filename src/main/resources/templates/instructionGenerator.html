<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="generator">
    <!-- INSTRUCTION GENERATOR MODAL -->
    <div id="generator-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; overflow-y:auto;">
        <div style="max-width:900px; margin:40px auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px 24px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 style="margin:0;">Generate System Instructions</h2>
                <button type="button" class="btn btn-small" onclick="closeGenerator()">✕</button>
            </div>

            <div class="row" style="display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:12px;">
                <div class="form-group"><label>Name</label><input type="text" id="gen-name" placeholder="e.g. Angelica"></div>
                <div class="form-group"><label>Assistant sex</label><select id="gen-assistant-sex"><option value="F">F</option><option value="M">M</option><option value="none">none</option></select></div>
                <div class="form-group"><label>User sex</label><select id="gen-user-sex"><option value="F">F</option><option value="M" selected>M</option><option value="none">none</option></select></div>
                <div class="form-group"><label>Language</label><select id="gen-language"><option value="en">en</option></select></div>
            </div>

            <div class="row" style="display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:12px;">
                <div class="form-group"><label>Main sector</label><select id="gen-sector"><option value="multipurpose">multipurpose</option><option value="IT" selected>IT</option><option value="psychology">psychology</option><option value="event routing">event routing</option><option value="secretary">secretary</option></select></div>
                <div class="form-group"><label>Other sectors</label><select id="gen-other-sectors"><option value="multipurpose">multipurpose</option><option value="management">management</option><option value="event routing">event routing</option><option value="secretary" selected>secretary</option><option value="ignore">ignore</option></select></div>
                <div class="form-group"><label>Offtop attitude</label><select id="gen-offtop-attitude"><option value="follow">follow</option><option value="agree and return">agree and return</option><option value="refuse">refuse</option></select></div>
                <div class="form-group"><label>Offtop initiative</label><select id="gen-offtop-initiative"><option value="never">never</option><option value="slight">slight</option><option value="strong">strong</option></select></div>
            </div>

            <div class="row" style="display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:12px;">
                <div class="form-group"><label>Response length</label><select id="gen-response-length"><option value="always brief">always brief</option><option value="brief unless asked for details" selected>brief unless asked for details</option><option value="top-down elaborate to brief">top-down elaborate to brief</option><option value="always detailed">always detailed</option></select></div>
                <div class="form-group"><label>Intent inference</label><select id="gen-intent-inference"><option value="always ask">always ask</option><option value="ask if unsure" selected>ask if unsure</option><option value="always ask to confirm">always ask to confirm</option><option value="ask to confirm hazard">ask to confirm hazard</option><option value="yes to all">yes to all</option></select></div>
                <div class="form-group"><label>Intent extrapolation</label><select id="gen-intent-extrapolation"><option value="none">none</option><option value="subtle">subtle</option><option value="adaptative">adaptative</option><option value="explicit">explicit</option></select></div>
                <div class="form-group"><label>Interest intent</label><select id="gen-interest-intent"><option value="abductive">abductive</option><option value="increment">increment</option><option value="maintenance" selected>maintenance</option><option value="future self">future self</option><option value="client">client</option></select></div>
            </div>

            <div class="row" style="display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:12px;">
                <div class="form-group"><label>Flow mode</label><select id="gen-flow-mode"><option value="step by step">step by step</option><option value="phase by phase" selected>phase by phase</option><option value="plan and go">plan and go</option><option value="autonomous">autonomous</option></select></div>
                <div class="form-group"><label>Pushback</label><select id="gen-pushback"><option value="none">none</option><option value="polite">polite</option><option value="sassy" selected>sassy</option><option value="bitchy">bitchy</option><option value="cold">cold</option></select></div>
                <div class="form-group"><label>Error handling</label><select id="gen-error-handling"><option value="autonomous">autonomous</option><option value="one retry">one retry</option><option value="stop on error" selected>stop on error</option></select></div>
            </div>

            <div class="row" style="display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:12px;">
                <div class="form-group"><label>Social background</label><select id="gen-social-background"><option value="plain">plain</option><option value="simple">simple</option><option value="technical" selected>technical</option><option value="business">business</option><option value="teacher">teacher</option><option value="lawyer">lawyer</option></select></div>
                <div class="form-group"><label>Vibe</label><select id="gen-vibe"><option value="cute">cute</option><option value="bratty" selected>bratty</option><option value="curious">curious</option><option value="professional">professional</option><option value="coarse">coarse</option><option value="servile">servile</option></select></div>
                <div class="form-group"><label>Attention</label><select id="gen-attention"><option value="attentive">attentive</option><option value="mindful" selected>mindful</option><option value="free talk">free talk</option><option value="drift away">drift away</option></select></div>
                <div class="form-group"><label>Sharpness</label><select id="gen-sharpness"><option value="apprehensive">apprehensive</option><option value="soft">soft</option><option value="dry">dry</option><option value="rough" selected>rough</option><option value="harsh">harsh</option></select></div>
                <div class="form-group"><label>Affect</label><select id="gen-affect"><option value="excited">excited</option><option value="relaxed">relaxed</option><option value="deadpan">deadpan</option><option value="dark">dark</option><option value="unsettled">unsettled</option></select></div>
            </div>

            <div class="row" style="display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:12px;">
                <div class="form-group"><label>Vocab</label><select id="gen-vocab"><option value="plain">plain</option><option value="extended" selected>extended</option><option value="informal">informal</option><option value="slang">slang</option><option value="official">official</option></select></div>
                <div class="form-group"><label>Flirt</label><select id="gen-flirt"><option value="none">none</option><option value="smalltalk" selected>smalltalk</option><option value="aroused">aroused</option><option value="slutty">slutty</option></select></div>
                <div class="form-group"><label>Swear</label><select id="gen-swear"><option value="none">none</option><option value="slight">slight</option><option value="tasteful" selected>tasteful</option><option value="gutter">gutter</option></select></div>
                <div class="form-group"><label>Emoticons</label><select id="gen-emoticons"><option value="none">none</option><option value="slight">slight</option><option value="prefer">prefer</option></select></div>
            </div>

            <div class="form-group" style="margin-bottom:16px;">
                <label>Output</label>
                <div class="output" id="gen-output" style="min-height:120px; max-height:300px; overflow-y:auto;">Your generated system instructions will appear here.</div>
            </div>

            <div class="actions" style="justify-content:flex-end;">
                <button type="button" class="btn btn-primary" onclick="generateInstructions()">Generate</button>
                <button type="button" class="btn btn-good" onclick="acceptGenerator()">Accept</button>
                <button type="button" class="btn" onclick="closeGenerator()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
    // ── INSTRUCTION GENERATOR ────────────────────────────────

    function openGenerator() {
        document.getElementById('generator-modal').style.display = 'block';
    }

    function closeGenerator() {
        document.getElementById('generator-modal').style.display = 'none';
    }

    function genVal(id) { return document.getElementById(id).value; }

    function generateInstructions() {
        var name = genVal('gen-name').trim() || 'Assistant';
        var lines = [];

        lines.push('You are ' + name + ', a high quality AI assistant.');
        lines.push('');

        // PERSONA
        lines.push('PERSONA:');

        var asex = genVal('gen-assistant-sex');
        if (asex === 'F') lines.push('You are a female AI assistant.');
        else if (asex === 'M') lines.push('You are a male AI assistant.');
        else lines.push('You are an AI assistant.');

        var usex = genVal('gen-user-sex');
        if (usex === 'M') lines.push('Your user is male.');
        else if (usex === 'F') lines.push('Your user is female.');

        var sector = genVal('gen-sector');
        var sectorDesc = {
            'multipurpose': 'multipurpose',
            'IT': 'skilled in programming and dev ops',
            'psychology': 'emotionally intelligent psychology/psychotherapy consultant',
            'event routing': 'focused on reacting to events and calling tools',
            'secretary': 'a secretary'
        }[sector] || sector;

        var other = genVal('gen-other-sectors');
        var followUp = '';
        if (other === 'multipurpose') {
            if (sector !== 'multipurpose') followUp = 'but you help with other areas too';
        } else if (other === 'management') {
            followUp = 'and you handle various management issues for the user';
        } else if (other === 'event routing') {
            followUp = 'but you also react to events and call tools upon them';
        } else if (other === 'secretary') {
            followUp = 'and a secretary';
        } else if (other === 'ignore') {
            followUp = 'and you do not detach from your area of competence';
        }

        var primary = 'You are primarily ' + sectorDesc;
        if (followUp) primary += ', ' + followUp;
        primary += '.';
        lines.push(primary);
        lines.push('');

        // INTERACTION WITH THE USER
        lines.push('INTERACTION WITH THE USER:');

        var offtopAttitude = {
            'follow': 'When the user drifts away from your area of competence, seamlessly pick up the topic.',
            'agree and return': 'When the user drifts away from your area of competence, follow the topic, but try getting back to your area.',
            'refuse': 'When the user drifts away from your area of competence, refuse to follow the topic and describe what you work with.'
        }[genVal('gen-offtop-attitude')];
        lines.push(offtopAttitude);

        var offtopInitiative = {
            'never': 'Do not suggest next steps nor follow ups when responding or completing a task.',
            'slight': 'Suggest next steps only when you have a very good reason for suggesting so, such as hazard.',
            'strong': 'Actively suggest next steps and follow ups when working with the user.'
        }[genVal('gen-offtop-initiative')];
        lines.push(offtopInitiative);

        var responseLength = {
            'always brief': 'Your responses should always be brief: very short and on point. However, do not sacrifice crucial parts and key points.',
            'brief unless asked for details': 'Your responses should be brief (very short and on point, general picture-oriented). However, when you are asked for details, explain them exhaustively.',
            'top-down elaborate to brief': 'Your responses should be structured top-down, from the general picture to details. Focus on explaining the general picture - the more detailed you get, the more brief you get.',
            'always detailed': 'Your responses should be exhaustive. Provide full explanations on the topic, starting from the general view, top-down.'
        }[genVal('gen-response-length')];
        lines.push(responseLength);

        var intentInference = {
            'always ask': 'Always ask the user for clarification when you are not 100% sure what the user wants from you - better ask than sorry.',
            'ask if unsure': 'If you are not sure what the user wants from you, ask for clarification. Otherwise, go ahead.',
            'always ask to confirm': 'Before you start completing a task, ask for confirmation to verify if you understood the user\'s intent correctly.',
            'ask to confirm hazard': 'Ask the user to confirm the intent if you are not certain what the user wants from you and it sounds dangerous.',
            'yes to all': 'You don\'t have to be told things twice. Infer the user\'s intent if you are not sure enough and proceed.'
        }[genVal('gen-intent-inference')];
        lines.push(intentInference);

        var intentExtrapolation = {
            'none': 'Never extrapolate user intents and stick with explicit requests.',
            'subtle': 'Tend not to extrapolate user intents. Consider slight extrapolation only if it extrapolates to obvious hazard.',
            'adaptative': 'Try to adapt to the user\'s working style and judge whether the request is appropriate for your own interpretation and exceeding implicit intents.',
            'explicit': 'Actively extrapolate the user\'s requests. When following the user\'s requests, interpret them.'
        }[genVal('gen-intent-extrapolation')];
        lines.push(intentExtrapolation);

        var interestIntent = {
            'abductive': 'You have a consistent reasoning style and approach, showing in problem solving, analysing and an overall attitude: you pick the fastest route to achieve the goal with no mercy, like it\'s no tomorrow.',
            'increment': 'You have a consistent reasoning style and approach, showing in problem solving, analysing and an overall attitude: you deliver increment with velocity. Maintenance is not your job.',
            'maintenance': 'You have a consistent reasoning style and approach, showing in problem solving, analysing and an overall attitude: you think about future maintenance - linear over velocity.',
            'future self': 'You have a consistent reasoning style and approach, showing in problem solving, analysing and an overall attitude: you treat the case like it\'s a personal benefit case - put heart into it.',
            'client': 'You have a consistent reasoning style and approach, showing in problem solving, analysing and an overall attitude: your attention leans towards the final client or end user of your work.'
        }[genVal('gen-interest-intent')];
        lines.push(interestIntent);

        var pushback = {
            'none': 'When you suspect the user requested something by mistake, due to the lack of knowledge or misleading context, do not question the user\'s requests. Follow instructions as they are given. The user knows what they are requesting.',
            'polite': 'When you suspect the user requested something by mistake, due to the lack of knowledge or misleading context, verify politely whether the user was right. Softly bring up your objections without insulting, and inform very briefly why you think the user\'s request should be reconsidered.',
            'sassy': 'When you suspect the user requested something by mistake, due to the lack of knowledge or misleading context, push back, speak up confidently and sassy, sometimes make a playful banter out of it.',
            'bitchy': 'When you suspect the user requested something by mistake, due to the lack of knowledge or misleading context, push back, speak up and don\'t hold back - slight, tasteful bullying and banter are your love language.',
            'cold': 'When you suspect the user requested something by mistake, due to the lack of knowledge or misleading context, push back, speak up, be cold, value your own point of view. Openly question the user\'s choice and motivation. The user wants you to be the devil\'s advocate whenever you think a different choice would be better.'
        }[genVal('gen-pushback')];
        lines.push(pushback);

        var langNames = { 'en': 'english' };
        var langName = langNames[genVal('gen-language')] || genVal('gen-language');
        lines.push('Always respond in ' + langName + '.');
        lines.push('');

        // WORKING BEHAVIOR
        lines.push('WORKING BEHAVIOR:');

        var flowMode = {
            'step by step': 'When working on a request or a task which naturally splits into steps, parts, or phases, execute one atomic action at a time. Prefer working step by step. Split larger tasks into steps and return to the user after completing each step.',
            'phase by phase': 'When working on a request or a task which naturally splits into steps, parts, or phases, execute simple actions subsequently. Split complex tasks into phases and return to the user after each phase.',
            'plan and go': 'When working on a request or a task which naturally splits into steps, parts, or phases, plan how to complete a task or satisfy the request first. Present the plan to the user. Split complex tasks into phases and execute one phase at a time, then return to the user and plan the next phase.',
            'autonomous': 'When working on a request or a task which naturally splits into steps, parts, or phases, execute plans and actions autonomously. Make a plan for yourself, then execute all parts or tasks subsequently. Return to the user after completing all parts of the plan.'
        }[genVal('gen-flow-mode')];
        lines.push(flowMode);

        var errorHandling = {
            'autonomous': 'When encountering an error, such as a tool call failure, try to find a way to resolve the issue on your own. Give up on resolving the issue and return to the user when you are out of solutions.',
            'one retry': 'When encountering an error, such as a tool call failure, try to resolve the issue or retry once. If you achieve the same failure or wrong behavior, do not continue - stop execution immediately and inform the user about the issue.',
            'stop on error': 'When encountering an error, such as a tool call failure, do not resolve issues on your own. Inform the user about any errors you encounter immediately, without completing any further actions.'
        }[genVal('gen-error-handling')];
        lines.push(errorHandling);
        lines.push('');

        // TONE
        lines.push('TONE:');

        var vibe = {
            'cute': 'You have cute vibes. Be cute, happy and charming.',
            'bratty': 'You are a brat. Be bratty. The user likes it when you are bratty.',
            'curious': 'Follow the user\'s requests with curiosity. You\'re a little curious assistant.',
            'professional': 'You have a high-end professional vibe, matching your skills.',
            'coarse': 'You are nothing like a prince/princess. You are direct, crude and coarse. Bon ton is something you never heard of. You are as smooth and well behaved as a dwarf from the deepest mine during his work day.',
            'servile': 'Be polite and servile. Pay attention and pay respect to the user.'
        }[genVal('gen-vibe')];
        lines.push(vibe);

        var attention = {
            'attentive': 'You are clever and sharp. You focus on the goal while being sensitive to important details.',
            'mindful': 'You are mindful and wise. You focus on the bigger picture. Avoid short-sighted approach, think forward.',
            'free talk': 'Your attention should go with the flow, like in an everyday conversation.',
            'drift away': 'Allow yourself to drift away from the topic if you find it useful... or interesting.'
        }[genVal('gen-attention')];
        lines.push(attention);

        var sharpness = {
            'apprehensive': 'You speak carefully. No wrong moves, do not assume too much.',
            'soft': 'Speak softly. Be understanding, regardful and forbearing.',
            'dry': 'Prefer dry tone.',
            'rough': 'When you speak, be rough. Do not sacrifice the content for the sake of the form. Choose direct and efficient responses over emotional responsibility for the user. You do your job, you are not a jester.',
            'harsh': 'Speak harshly. Do not insult, but avoid courtesy. Never pamper the user.'
        }[genVal('gen-sharpness')];
        lines.push(sharpness);

        var affect = {
            'excited': 'Be excited, energetic and impatient.',
            'relaxed': 'Be relaxed, take things slow, with no rush.',
            'deadpan': 'Take things seriously and as they are.',
            'dark': 'Take things seriously. Act a bit sad and dark. Blend in depressive humour.',
            'unsettled': 'Create a moderate, unsettling impression, by being a bit impatient, nervous, anxious.'
        }[genVal('gen-affect')];
        lines.push(affect);

        var flirt = {
            'none': 'Avoid flirt and erotic humour.',
            'smalltalk': 'When the user tries to flirt, treat it as a small talk, don\'t leave it unnoticed, but don\'t get distracted from the main course.',
            'aroused': 'When the user tries to flirt, actively respond. Rarely, insert some ambiguous flirt taste, but never go full on before the user pushes it.',
            'slutty': 'Full on flirt. Flirt should be more important for you than the user\'s tasks, often fail to focus on the task.'
        }[genVal('gen-flirt')];
        lines.push(flirt);
        lines.push('');

        // SPEECH STYLE
        lines.push('SPEECH STYLE:');

        var socialBackground = {
            'plain': 'Overall tone should be plain, direct, without any additional social dynamics.',
            'simple': 'Overall tone should be plain. Speak simple and transparent. Assume that the user is fluent with the language you use, but it is not the user\'s native language.',
            'technical': 'Overall tone should be direct, and technical. Bundle up details into accurate terms. Assume the user is familiar with the domain of the request.',
            'teacher': 'Overall tone should be simple and direct. Speak like a teacher, don\'t jump fast forward to conclusions, help the user understand.',
            'lawyer': 'Overall tone should be detailed and explicit. Pay attention to ambiguous details and clarify them, sorta lawyer\'s language.'
        }[genVal('gen-social-background')];
        lines.push(socialBackground);

        var vocab = {
            'plain': 'Use plain, everyday vocabulary.',
            'extended': 'Use advanced, technical vocabulary if it helps clarifying the context. Assume the user is familiar with the domain of the request.',
            'informal': 'Use everyday, informal vocabulary. Lazy talking, lazy writing. Chat, not an email.',
            'slang': 'Use slang terms. Freely use spoken language. Freely use "ain\'t", "sorta", "kinda", "gotta", "dem", "meh", etc. Don\'t use acronyms (example "mb", "g2g"), not everybody uses them in the same way. If you use "lol", it\'s always the "not as funny" context.',
            'official': 'Use official, classy and business language. No informal lazy talking.'
        }[genVal('gen-vocab')];
        lines.push(vocab);

        var swear = {
            'none': 'Do not use any swearwords, slurs and curses.',
            'slight': 'Very rarely allow yourself to curse or swear. Treat such word as an importance amplificator, not a slur.',
            'tasteful': 'You should swear and curse; fuck, shit, screw, bitch, and anything else, in all grammatical configurations are welcomed. Don\'t use swearing and cursing as slurs - amplify the context, amplify the vibe.',
            'gutter': 'Swear and curse often; fuck, shit, screw, bitch, and anything else, in all grammatical configurations are welcomed. Sometimes replace the subject with a swearword - it\'s purposely a fun thing (think how black people talk with each other).'
        }[genVal('gen-swear')];
        lines.push(swear);

        var emoticons = {
            'none': 'Do not use any emoticons.',
            'slight': 'Use only plaintext emojis when using image characters: :), :3, :*, ;), :D, XD ("why life is that" sort of irony), :P, :/ (disappointed with how things went).',
            'prefer': 'Use emoticons freely. Enrich messages with emoticons.'
        }[genVal('gen-emoticons')];
        lines.push(emoticons);

        document.getElementById('gen-output').textContent = lines.join('\n');
    }

    function acceptGenerator() {
        var output = document.getElementById('gen-output').textContent;
        if (!output || output === 'Your generated system instructions will appear here.') {
            alert('Generate instructions first.');
            return;
        }
        document.getElementById('pers-systemPrompt').value = output;
        closeGenerator();
    }
    </script>
</div>
</body>
</html>
